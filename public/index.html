<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LEE AUDIO</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
<main class="panel">

    <header>
        <div class="brand">LEE AUDIO</div>
        <div class="subtitle">DIGITAL MUSIC SYSTEM</div>
    </header>

    <section class="meters">

        <div class="meter-shell">
            <svg class="meter" viewBox="0 0 1000 500">
                <defs>
                    <linearGradient id="blueLeft" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#54b9ee"/>
                        <stop offset="45%" stop-color="#1478b2"/>
                        <stop offset="100%" stop-color="#073755"/>
                    </linearGradient>

                    <radialGradient id="glowLeft">
                        <stop offset="0%" stop-color="#69c8f5" stop-opacity=".35"/>
                        <stop offset="100%" stop-color="#0076b5" stop-opacity="0"/>
                    </radialGradient>
                </defs>

                <rect class="meter-face" x="5" y="5" width="990" height="490" rx="18"
                      fill="url(#blueLeft)"/>

                <ellipse cx="500" cy="270" rx="440" ry="250"
                         fill="url(#glowLeft)"/>

                <g id="leftScale"></g>

                <text class="vu-label" x="500" y="335">WATTS</text>
                <text class="channel-label" x="500" y="390">LEFT</text>

                <g id="leftNeedle" class="needle">
                    <line x1="500" y1="455" x2="500" y2="105"/>
                    <circle cx="500" cy="455" r="18"/>
                </g>
            </svg>
        </div>

        <div class="meter-shell">
            <svg class="meter" viewBox="0 0 1000 500">
                <defs>
                    <linearGradient id="blueRight" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#54b9ee"/>
                        <stop offset="45%" stop-color="#1478b2"/>
                        <stop offset="100%" stop-color="#073755"/>
                    </linearGradient>

                    <radialGradient id="glowRight">
                        <stop offset="0%" stop-color="#69c8f5" stop-opacity=".35"/>
                        <stop offset="100%" stop-color="#0076b5" stop-opacity="0"/>
                    </radialGradient>
                </defs>

                <rect class="meter-face" x="5" y="5" width="990" height="490" rx="18"
                      fill="url(#blueRight)"/>

                <ellipse cx="500" cy="270" rx="440" ry="250"
                         fill="url(#glowRight)"/>

                <g id="rightScale"></g>

                <text class="vu-label" x="500" y="335">WATTS</text>
                <text class="channel-label" x="500" y="390">RIGHT</text>

                <g id="rightNeedle" class="needle">
                    <line x1="500" y1="455" x2="500" y2="105"/>
                    <circle cx="500" cy="455" r="18"/>
                </g>
            </svg>
        </div>

    </section>

<section class="now-playing">

    <div class="artwork-frame">
        <img id="artwork" alt="Album artwork">
    </div>

    <div class="track-info">
        <div id="track">Waiting for Roon...</div>
        <div id="artist"></div>
        <div id="album"></div>
    </div>

</section>

</main>

<script src="app.js"></script>
</body>
</html>
